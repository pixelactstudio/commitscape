[workspace]
resolver = "2"
members = [
    "crates/commitscape-core",
    "crates/commitscape-forge",
    "crates/commitscape-index",
    "crates/commitscape-metrics",
    "crates/commitscape-tui",
    "crates/commitscape-report",
    "crates/commitscape",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/pixelactstudio/commitscape"
homepage = "https://github.com/pixelactstudio/commitscape"

[workspace.dependencies]
commitscape-core = { path = "crates/commitscape-core", version = "0.1.1" }
commitscape-forge = { path = "crates/commitscape-forge", version = "0.1.1" }
commitscape-index = { path = "crates/commitscape-index", version = "0.1.1" }
commitscape-metrics = { path = "crates/commitscape-metrics", version = "0.1.1" }
commitscape-report = { path = "crates/commitscape-report", version = "0.1.1" }
commitscape-tui = { path = "crates/commitscape-tui", version = "0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dist]
inherits = "release"
debug = 0
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
