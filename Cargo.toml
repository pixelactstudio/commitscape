[workspace]
resolver = "2"
members = [
    "crates/commitscape-core",
    "crates/commitscape-forge",
    "crates/commitscape-index",
    "crates/commitscape-metrics",
    "crates/commitscape-tui",
    "crates/commitscape-report",
    "crates/commitscape",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dist]
inherits = "release"
debug = 0
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
