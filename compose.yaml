x-shared: &shared
  DATABASE_URL: postgres://commitscape:${POSTGRES_PASSWORD}@postgres:5432/commitscape
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET:-commitscape-reports}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commitscape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: commitscape
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitscape"]
      interval: 5s
      retries: 20

  builder:
    build:
      context: .
      dockerfile: apps/builder/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *shared
      CONCURRENCY: ${CONCURRENCY:-1}
      FULL_CLONE_UP_TO_MB: ${FULL_CLONE_UP_TO_MB:-100}
      MAX_REPOSITORY_MB: ${MAX_REPOSITORY_MB:-3000}
      TIME_LIMIT_SECONDS: ${TIME_LIMIT_SECONDS:-900}
      DISK_BUDGET_GB: ${DISK_BUDGET_GB:-20}
      SEED_BUDGET: ${SEED_BUDGET:-50}
      SEED_PER_LANGUAGE: ${SEED_PER_LANGUAGE:-10}
      SEED_LANGUAGES: ${SEED_LANGUAGES:-JavaScript,TypeScript,Python,Go,Rust,Java,C,C++,Ruby}
    volumes:
      - builder-work:/work

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *shared
      BETTER_AUTH_URL: ${SITE_URL:?set SITE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
    expose:
      - "3000"

volumes:
  postgres:
  builder-work:
