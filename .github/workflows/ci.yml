name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Configure git for fixture generation
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Build fixtures
        run: cargo xtask fixtures --force

      - name: Check the walk against git
        shell: bash
        run: |
          for f in linear coupling ownership renames bulk merges conflict rhythm detached shallow; do
            cargo xtask verify-walk "fixtures/$f" --every 1
          done

      - name: Test
        env:
          INSTA_UPDATE: "no"
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Layering
        run: cargo xtask check-layering

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://commitscape:commitscape@localhost:5434/commitscape
      TEST_S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for fixture generation
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Postgres and S3
        run: |
          docker compose -f compose.dev.yaml up -d --wait postgres minio
          docker compose -f compose.dev.yaml up minio-bucket

      - name: Typecheck, lint, test and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build the binary and the fixtures
        run: |
          cargo xtask fixtures --force
          cargo build --release -p commitscape

      - name: The Site, end to end
        working-directory: apps/site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
