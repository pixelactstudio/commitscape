name: CI

# Build and test only. Publishing is deliberately not here: ADR-0003 describes a
# release that must publish six platform packages before the package that
# depends on them, and that ordering is not something to bolt onto a push hook.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Configure git for fixture generation
        # The fixture generator stamps its own authors and dates, but git
        # refuses to commit at all without some identity configured.
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Build fixtures
        run: cargo xtask fixtures --force

      - name: Check the walk against git
        # The walk computes its own tree diffs, including git's combined diff
        # for merges. Every fixture commit must match `git diff-tree -c`.
        shell: bash
        run: |
          for f in linear coupling ownership renames bulk merges conflict rhythm detached shallow; do
            cargo xtask verify-walk "fixtures/$f" --every 1
          done

      - name: Test
        # A snapshot that differs fails the run; none is ever written here.
        # --no-fail-fast runs every test binary, so one failure does not hide
        # the others.
        env:
          INSTA_UPDATE: "no"
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Layering
        # ADR-0001's seam is only real if the metrics crate genuinely cannot
        # reach gix. This asserts it on every push.
        run: cargo xtask check-layering

  web:
    # The TypeScript workspace (ADR-0013): its checks through Turborepo,
    # then the local page's screens in Chromium against a fixture, through
    # the real binary.
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for fixture generation
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Typecheck, lint, test and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build the binary, with the web app inside, and the fixtures
        run: |
          cargo xtask fixtures --force
          cargo build --release -p commitscape

      - name: The screens, end to end
        working-directory: apps/local
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: The Site, end to end under wrangler dev
        # Local D1 and R2 only: nothing is deployed (ADR-0014).
        working-directory: apps/site
        run: pnpm e2e

      - name: The Site's API handlers stay far under 10 ms of CPU
        working-directory: apps/site
        env:
          REPORT_FILE: ${{ runner.temp }}/ownership.json.gz
        run: |
          ../../target/release/commitscape report --data --offline --no-cache --window all --out "$REPORT_FILE" ../../fixtures/ownership
          pnpm exec vitest run --config scripts/vitest.config.ts
