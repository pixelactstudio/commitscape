name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Configure git for fixture generation
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Build fixtures
        run: cargo xtask fixtures --force

      - name: Check the walk against git
        shell: bash
        run: |
          for f in linear coupling ownership renames bulk merges conflict rhythm detached shallow; do
            cargo xtask verify-walk "fixtures/$f" --every 1
          done

      - name: Test
        env:
          INSTA_UPDATE: "no"
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Layering
        run: cargo xtask check-layering

      - name: Workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.98 check --workspace --all-targets --locked

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://commitscape:commitscape@localhost:5434/commitscape
      TEST_S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for fixture generation
        run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Postgres and S3
        run: |
          docker compose -f compose.dev.yaml up -d --wait

      - name: Typecheck, lint, test and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Every schema change has its migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/server/drizzle)" ]; then
            git status --porcelain packages/server/drizzle
            echo "::error::The schema changed without a migration: run pnpm db:generate and commit it."
            exit 1
          fi

      - name: Build the binary and the fixtures
        run: |
          cargo xtask fixtures --force
          cargo build --release -p commitscape

      - name: The Site, end to end
        working-directory: apps/site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 14

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TEST_DATABASE_URL: postgres://commitscape:commitscape@localhost:5434/commitscape
      TEST_S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@6db3a280da9eee4283c045c7431ab5116f1a0089 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: |
          git config --global user.name "commitscape ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: docker compose -f compose.dev.yaml up -d --wait
      - name: Rust
        env:
          INSTA_UPDATE: "no"
        run: |
          cargo xtask fixtures --force
          cargo llvm-cov --workspace --exclude xtask --lcov --output-path rust.lcov
      - name: TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter "./packages/*" --filter "./apps/*" exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: rust.lcov,packages/data/coverage/lcov.info,packages/ui/coverage/lcov.info,packages/server/coverage/lcov.info,apps/site/coverage/lcov.info,apps/builder/coverage/lcov.info
          fail_ci_if_error: false

  packages:
    name: packages install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: crates.io
        run: cargo publish --workspace --dry-run --locked
      - name: npm
        run: |
          cargo build --profile dist -p commitscape
          cargo xtask npm --out target/npm --repository "https://github.com/$GITHUB_REPOSITORY" --binary "linux-x64-gnu=target/dist/commitscape"
          mkdir -p /tmp/try && cd /tmp/try && npm init -y > /dev/null
          for dir in "$GITHUB_WORKSPACE"/target/npm/*/; do (cd "$dir" && npm pack --pack-destination /tmp/try > /dev/null); done
          npm install --no-audit --no-fund /tmp/try/*.tgz
          npx commitscape --version
      - name: .deb
        run: |
          mkdir -p target/nfpm dist
          install -m 755 target/dist/commitscape target/nfpm/commitscape
          docker run --rm -u "$(id -u)" -v "$PWD":/w -w /w -e VERSION=0.0.0 -e ARCH=amd64 goreleaser/nfpm:v2.43.1 package -f packaging/nfpm.yaml -p deb -t dist/
          sudo dpkg -i dist/*.deb
          commitscape --version
