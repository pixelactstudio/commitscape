[package]
name = "commitscape"
description = "A terminal UI that reads a git repository and reports what changes what you do next."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["git", "cli", "tui", "hotspots", "ownership"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "commitscape"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
commitscape-core.workspace = true
commitscape-forge.workspace = true
commitscape-index.workspace = true
commitscape-metrics.workspace = true
commitscape-tui.workspace = true
commitscape-report.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
