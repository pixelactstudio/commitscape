[package]
name = "commitscape"
description = "A terminal UI that reads a git repository and reports what changes what you do next."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "commitscape"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
commitscape-core = { path = "../commitscape-core" }
commitscape-forge = { path = "../commitscape-forge" }
commitscape-index = { path = "../commitscape-index" }
commitscape-metrics = { path = "../commitscape-metrics" }
commitscape-tui = { path = "../commitscape-tui" }
commitscape-web = { path = "../commitscape-web" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
