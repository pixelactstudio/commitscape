[package]
name = "commitscape-index"
description = "Walks a repository into an Index, and caches it. The only crate that knows git exists."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
commitscape-core = { path = "../commitscape-core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

bincode = { version = "=2.0.1", features = ["serde"] }

gix = { version = "0.87.1", default-features = false, features = [
    "sha1",
    "mailmap",
    "parallel",
    "max-performance-safe",
    "revision",
] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
globset = "0.4.20"
imara-diff = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"
