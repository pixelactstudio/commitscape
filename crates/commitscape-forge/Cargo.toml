[package]
name = "commitscape-forge"
description = "What a code host says about a repository: GitHub, through the gh CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Knows nothing of git or of the index: it turns a remote URL into numbers
# from the host. The binary decides whether and when to ask (ADR-0009).
[dependencies]
commitscape-core = { path = "../commitscape-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
