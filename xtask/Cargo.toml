[package]
name = "xtask"
description = "Repository automation: fixture generation, benchmarks, layering checks. Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
commitscape-core = { version = "0.1.0", path = "../crates/commitscape-core" }
commitscape-forge = { version = "0.1.0", path = "../crates/commitscape-forge" }
commitscape-index = { version = "0.1.0", path = "../crates/commitscape-index" }
commitscape-metrics = { version = "0.1.0", path = "../crates/commitscape-metrics" }
commitscape-tui = { version = "0.1.0", path = "../crates/commitscape-tui" }
ratatui = "0.30.2"
# Writes the npm packages' package.json files.
serde_json = "1.0.151"
