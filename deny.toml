[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable; the index cache format depends on it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
