[package]
name = "commitscape-engine"
description = "Answers the Site's questions about a repository from the pack its Build uploaded."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "commitscape-engine"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
commitscape-core.workspace = true
commitscape-metrics.workspace = true
commitscape-report.workspace = true
rayon = "1.12.0"
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "ureq"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.4"

[dev-dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
commitscape-index.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
