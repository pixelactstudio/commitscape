name: commitscape-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commitscape
      POSTGRES_PASSWORD: commitscape
      POSTGRES_DB: commitscape
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitscape"]
      interval: 2s
      retries: 30
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: commitscape-reports
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9100:9090"
    volumes:
      - s3:/s3mockroot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/commitscape-reports || curl -sf http://127.0.0.1:9090/commitscape-reports"]
      interval: 2s
      retries: 30
volumes:
  postgres:
  s3:
