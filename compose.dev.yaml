name: commitscape-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commitscape
      POSTGRES_PASSWORD: commitscape
      POSTGRES_DB: commitscape
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitscape"]
      interval: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: commitscape
      MINIO_ROOT_PASSWORD: commitscape
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio:/data
  minio-bucket:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 commitscape commitscape; do sleep 1; done &&
             mc mb --ignore-existing local/commitscape-reports"
volumes:
  postgres:
  minio:
