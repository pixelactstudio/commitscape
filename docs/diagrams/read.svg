<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
<title id="title">A page view: where a repository's answers come from</title>
<desc id="desc">A browser opens a repository page. The request passes Cloudflare, which caches only Cards and shared files. The Site's route loader calls a server function, which reads the repository's pack key from Postgres, asks the engine service with it, or reads a stored file from R2. Postgres answers row lookups: the pack key, Commits pages, branches, pull requests and GitHub facts. The engine service answers every screen for any Window, the Code window, Commits under a folder, the Universe's rows and a pull request's insight from the pack, keeping answers and packs in memory and packs on disk; it fetches each pack from R2 once. R2 holds file text, pull request diffs, the Universe's Atlas, Cards and Shared Reports. Amber marks what is kept so it is not worked out again.</desc>
<style>
svg{--bg:#ffffff;--fg:#1f2328;--mute:#59636e;--line:#d1d9e0;--panel:#ffffff;--soft:#f6f8fa;--acc:#1a7f37;--accs:#e6f4ea;--warn:#9a6700;--warns:#fff8c5;--onacc:#ffffff}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6edf3;--mute:#9198a1;--line:#3d444d;--panel:#151b23;--soft:#212830;--acc:#3fb950;--accs:#12261e;--warn:#d29922;--warns:#2b2111;--onacc:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg);font-size:11px}
.tt{font-size:13px;font-weight:650}
.t{font-size:11.5px;font-weight:600}
.s{font-size:10px;fill:var(--mute)}
.k{font-size:10px;fill:var(--fg)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px}
.lbl{font-size:10px;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.bg{fill:var(--bg);stroke:var(--line)}
.box{fill:var(--panel);stroke:var(--line)}
.svc{fill:var(--panel);stroke:var(--acc);stroke-width:1.5}
.pill{fill:var(--soft)}
.store{fill:var(--accs);stroke:var(--acc)}
.band{fill:var(--soft);stroke:var(--line)}
.kept{fill:var(--warns);stroke:var(--warn)}
.ar{stroke:var(--mute);stroke-width:1.3;fill:none}
.ah{fill:var(--mute)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="899" height="469" rx="10"/>
<text class="tt" x="24" y="44">A page view</text>
<text class="s" x="24" y="62">each route loads its data on the server,</text>
<text class="s" x="24" y="76">so the page arrives drawn with it</text>

<g class="n"><rect class="box" x="16" y="150" width="156" height="150" rx="8"/>
<text class="t" x="94" y="174" text-anchor="middle">Browser</text>
<text class="s" x="94" y="190" text-anchor="middle">opens a repository,</text>
<text class="s" x="94" y="204" text-anchor="middle">then each screen</text>
<g class="n"><rect class="kept" x="24" y="226" width="140" height="62" rx="6"/>
<text class="k" x="94" y="244" text-anchor="middle">kept: answers already</text>
<text class="k" x="94" y="258" text-anchor="middle">fetched; ETags from</text>
<text class="k" x="94" y="272" text-anchor="middle">the pack key</text></g></g>

<g class="n"><rect class="band" x="200" y="150" width="112" height="150" rx="8"/>
<text class="t" x="256" y="174" text-anchor="middle">Cloudflare</text>
<text class="s" x="256" y="190" text-anchor="middle">passes pages</text>
<text class="s" x="256" y="204" text-anchor="middle">and the API through</text>
<g class="n"><rect class="kept" x="208" y="226" width="96" height="62" rx="6"/>
<text class="k" x="256" y="244" text-anchor="middle">kept: Cards,</text>
<text class="k" x="256" y="258" text-anchor="middle">shared files</text>
<text class="k" x="256" y="272" text-anchor="middle">(cache rules)</text></g></g>

<g class="n"><rect class="svc" x="340" y="110" width="220" height="232" rx="10"/>
<text class="tt" x="450" y="134" text-anchor="middle">Site</text>
<text class="s" x="450" y="150" text-anchor="middle">route loader, server function</text>
<g class="n"><rect class="pill" x="350" y="162" width="200" height="26" rx="6"/><text class="s" x="450" y="179" text-anchor="middle">1 · the pack key, from Postgres</text></g>
<g class="n"><rect class="pill" x="350" y="194" width="200" height="26" rx="6"/><text class="s" x="450" y="211" text-anchor="middle">2 · asks the engine with it</text></g>
<g class="n"><rect class="pill" x="350" y="226" width="200" height="26" rx="6"/><text class="s" x="450" y="243" text-anchor="middle">or reads rows, or a stored file</text></g>
<g class="n"><rect class="kept" x="350" y="264" width="200" height="66" rx="6"/>
<text class="k" x="450" y="282" text-anchor="middle">kept: the pack key, 10 s;</text>
<text class="k" x="450" y="297" text-anchor="middle">answers it sent, brotli-packed,</text>
<text class="k" x="450" y="312" text-anchor="middle">64 MB; Report answers, 16 MB</text></g></g>

<g class="n"><rect class="store" x="610" y="24" width="274" height="96" rx="8"/>
<text class="t" x="747" y="45" text-anchor="middle">Postgres: row lookups</text>
<text class="s" x="747" y="63" text-anchor="middle">the pack key on the Stored Index</text>
<text class="s" x="747" y="78" text-anchor="middle">Commits pages, branches, pull requests</text>
<text class="s" x="747" y="93" text-anchor="middle">a person's commits on a day</text>
<text class="s" x="747" y="108" text-anchor="middle">GitHub facts, kept for hours</text></g>

<g class="n"><rect class="svc" x="610" y="146" width="274" height="200" rx="10"/>
<text class="tt" x="747" y="170" text-anchor="middle">Engine service</text>
<text class="s" x="747" y="187" text-anchor="middle">answers from the pack:</text>
<text class="s" x="747" y="202" text-anchor="middle">every screen, for any Window</text>
<text class="s" x="747" y="217" text-anchor="middle">Code window, Commits under a folder</text>
<text class="s" x="747" y="232" text-anchor="middle">Universe rows, pull request insight</text>
<g class="n"><rect class="kept" x="620" y="246" width="254" height="26" rx="6"/><text class="k" x="747" y="263" text-anchor="middle">kept: answers, 128 MB</text></g>
<g class="n"><rect class="kept" x="620" y="278" width="254" height="26" rx="6"/><text class="k" x="747" y="295" text-anchor="middle">kept: packs in memory, 512 MB</text></g>
<g class="n"><rect class="kept" x="620" y="310" width="254" height="26" rx="6"/><text class="k" x="747" y="327" text-anchor="middle">kept: packs on disk, 10 GB</text></g></g>

<g class="n"><rect class="store" x="610" y="372" width="274" height="82" rx="8"/>
<text class="t" x="747" y="393" text-anchor="middle">R2: stored files</text>
<text class="s" x="747" y="411" text-anchor="middle">file text, pull request diffs</text>
<text class="s" x="747" y="426" text-anchor="middle">the Universe's Atlas, Cards</text>
<text class="s" x="747" y="441" text-anchor="middle">Shared Reports, older Reports</text></g>

<line class="ar" x1="172" y1="225" x2="198" y2="225" marker-end="url(#a)"/>
<line class="ar" x1="312" y1="225" x2="338" y2="225" marker-end="url(#a)"/>
<path class="ar" d="M560,176 H585 V72 H608" marker-end="url(#a)"/>
<line class="ar" x1="560" y1="207" x2="608" y2="207" marker-end="url(#a)"/>
<path class="ar" d="M560,239 H585 V413 H608" marker-end="url(#a)"/>
<line class="ar" x1="747" y1="346" x2="747" y2="370" marker-end="url(#a)"/>
<text class="lbl" x="755" y="362">a pack, once</text>

<g class="n"><rect class="kept" x="16" y="392" width="18" height="14" rx="3"/></g>
<text class="s" x="42" y="403">kept: worked out or fetched once, then served again</text>
<text class="s" x="16" y="428">A public repository's pinned addresses are cached a year;</text>
<text class="s" x="16" y="442">every page needs sign-in, except Cards and Shared Reports.</text>
</svg>
