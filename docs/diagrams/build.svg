<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-labelledby="title desc">
<title id="title">A Build, from the queue to the engine service</title>
<desc id="desc">A Build is asked for by a visit, a push, a seed or a rebuild and waits in the pg-boss queue in Postgres until the Builder claims it. A cold Build runs two phases at once. Phase 1 clones without old file contents, finds GitHub logins, runs commitscape build without lines, copies the rows into a new Stored Index, uploads a quick pack to R2 and publishes the first Report. Phase 2 fetches a full clone beside it, runs commitscape build with a line budget, counting Lines Changed for the Mainline first, newest first, then the rest, fills the lines into the same Stored Index, uploads the lines pack and publishes. Git data runs beside the line pass, commits left are counted by up to three quiet Builds, and Bulk Commits, lockfiles, Generated Files, binary files and files over a megabyte are never counted. Each run of commitscape build writes COPY files and meta.json for Postgres and pack.bin for R2; the pack's key goes on the Stored Index, and the engine service fetches the new pack once, at the first question about it.</desc>
<style>
svg{--bg:#ffffff;--fg:#1f2328;--mute:#59636e;--line:#d1d9e0;--panel:#ffffff;--soft:#f6f8fa;--acc:#1a7f37;--accs:#e6f4ea;--warn:#9a6700;--warns:#fff8c5;--onacc:#ffffff}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6edf3;--mute:#9198a1;--line:#3d444d;--panel:#151b23;--soft:#212830;--acc:#3fb950;--accs:#12261e;--warn:#d29922;--warns:#2b2111;--onacc:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg);font-size:11px}
.tt{font-size:13px;font-weight:650}
.t{font-size:11.5px;font-weight:600}
.s{font-size:10px;fill:var(--mute)}
.x{font-size:9px}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px}
.on{fill:var(--onacc);font-weight:600}
.lbl{font-size:10px;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.bg{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--soft);stroke:none}
.box{fill:var(--panel);stroke:var(--line)}
.svc{fill:var(--panel);stroke:var(--acc);stroke-width:1.5}
.pill{fill:var(--soft);stroke:var(--line)}
.store{fill:var(--accs);stroke:var(--acc)}
.main{fill:var(--acc)}
.rest{fill:var(--soft);stroke:var(--line)}
.ar{stroke:var(--mute);stroke-width:1.3;fill:none}
.dash{stroke-dasharray:4 3}
.ah{fill:var(--mute)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="899" height="511" rx="10"/>

<g class="n"><rect class="box" x="16" y="16" width="214" height="60" rx="8"/>
<text class="t" x="123" y="36" text-anchor="middle">A Build is asked for</text>
<text class="s" x="123" y="52" text-anchor="middle">a visit: no Report, or a day old</text>
<text class="s" x="123" y="66" text-anchor="middle">a push, a seed, or a rebuild</text></g>
<g class="n"><rect class="store" x="264" y="16" width="170" height="60" rx="8"/>
<text class="t" x="349" y="42" text-anchor="middle">pg-boss queue</text>
<text class="s" x="349" y="58" text-anchor="middle">in Postgres, by priority</text></g>
<g class="n"><rect class="svc" x="468" y="16" width="190" height="60" rx="8"/>
<text class="t" x="563" y="36" text-anchor="middle">The Builder claims it</text>
<text class="s" x="563" y="52" text-anchor="middle">cold: phases 1 and 2 at once</text>
<text class="s" x="563" y="66" text-anchor="middle">warm: one fetch, one build</text></g>
<line class="ar" x1="230" y1="46" x2="262" y2="46" marker-end="url(#a)"/>
<line class="ar" x1="434" y1="46" x2="466" y2="46" marker-end="url(#a)"/>
<path class="ar" d="M563,76 V88 H61 V98" marker-end="url(#a)"/>

<rect class="lane" x="16" y="100" width="868" height="72" rx="8"/>
<text class="t" x="26" y="128">Phase 1</text>
<text class="s" x="26" y="144">first Report</text>
<text class="s" x="26" y="158">cold Builds only</text>
<g class="n"><rect class="box" x="124" y="112" width="116" height="48" rx="6"/><text class="t" x="182" y="131" text-anchor="middle">blobless clone</text><text class="s" x="182" y="147" text-anchor="middle">no old file text</text></g>
<g class="n"><rect class="box" x="250" y="112" width="116" height="48" rx="6"/><text class="t m" x="308" y="131" text-anchor="middle">signatures</text><text class="s" x="308" y="147" text-anchor="middle">+ GitHub logins</text></g>
<g class="n"><rect class="box" x="376" y="112" width="116" height="48" rx="6"/><text class="t m" x="434" y="131" text-anchor="middle">build --no-lines</text><text class="s" x="434" y="147" text-anchor="middle">walks history once</text></g>
<g class="n"><rect class="box" x="502" y="112" width="116" height="48" rx="6"/><text class="t" x="560" y="131" text-anchor="middle">COPY rows</text><text class="s" x="560" y="147" text-anchor="middle">a new Stored Index</text></g>
<g class="n"><rect class="box" x="628" y="112" width="116" height="48" rx="6"/><text class="t" x="686" y="131" text-anchor="middle">quick pack</text><text class="s" x="686" y="147" text-anchor="middle">uploaded to R2</text></g>
<g class="n"><rect class="svc" x="754" y="112" width="116" height="48" rx="6"/><text class="t" x="812" y="131" text-anchor="middle">publish</text><text class="s" x="812" y="147" text-anchor="middle">the Report shows</text></g>
<line class="ar" x1="240" y1="136" x2="249" y2="136" marker-end="url(#b)"/>
<line class="ar" x1="366" y1="136" x2="375" y2="136" marker-end="url(#b)"/>
<line class="ar" x1="492" y1="136" x2="501" y2="136" marker-end="url(#b)"/>
<line class="ar" x1="618" y1="136" x2="627" y2="136" marker-end="url(#b)"/>
<line class="ar" x1="744" y1="136" x2="753" y2="136" marker-end="url(#b)"/>

<rect class="lane" x="16" y="184" width="868" height="92" rx="8"/>
<text class="t" x="26" y="222">Phase 2</text>
<text class="s" x="26" y="238">Lines Changed</text>
<text class="s" x="26" y="252">beside phase 1</text>
<g class="n"><rect class="box" x="124" y="194" width="116" height="72" rx="6"/><text class="t" x="182" y="220" text-anchor="middle">full clone</text><text class="s" x="182" y="236" text-anchor="middle">fetched beside</text><text class="s" x="182" y="250" text-anchor="middle">phase 1</text></g>
<g class="n"><rect class="box" x="250" y="194" width="242" height="72" rx="6"/>
<text class="t m" x="371" y="212" text-anchor="middle">build --lines-budget 120</text>
<text class="s" x="371" y="227" text-anchor="middle">same cache, so no second walk</text>
<g class="n"><rect class="main" x="258" y="236" width="150" height="20" rx="4"/><text class="s x on" x="333" y="249.5" text-anchor="middle">the Mainline, newest first</text></g>
<g class="n"><rect class="rest" x="412" y="236" width="72" height="20" rx="4"/><text class="s x" x="448" y="249.5" text-anchor="middle">the rest</text></g></g>
<g class="n"><rect class="box" x="502" y="194" width="116" height="72" rx="6"/><text class="t" x="560" y="220" text-anchor="middle">fill in lines</text><text class="s" x="560" y="236" text-anchor="middle">same Stored Index</text><text class="s" x="560" y="250" text-anchor="middle">after phase 1</text></g>
<g class="n"><rect class="box" x="628" y="194" width="116" height="72" rx="6"/><text class="t" x="686" y="220" text-anchor="middle">lines pack</text><text class="s" x="686" y="236" text-anchor="middle">uploaded to R2</text><text class="s" x="686" y="250" text-anchor="middle">quick one deleted</text></g>
<g class="n"><rect class="svc" x="754" y="194" width="116" height="72" rx="6"/><text class="t" x="812" y="220" text-anchor="middle">publish</text><text class="s" x="812" y="236" text-anchor="middle">lines show once the</text><text class="s" x="812" y="250" text-anchor="middle">Mainline is counted</text></g>
<line class="ar" x1="240" y1="230" x2="249" y2="230" marker-end="url(#b)"/>
<line class="ar" x1="492" y1="230" x2="501" y2="230" marker-end="url(#b)"/>
<line class="ar" x1="618" y1="230" x2="627" y2="230" marker-end="url(#b)"/>
<line class="ar" x1="744" y1="230" x2="753" y2="230" marker-end="url(#b)"/>
<path class="ar dash" d="M560,160 V192" marker-end="url(#b)"/>
<text class="s" x="568" y="181.5">waits for it</text>

<g class="n"><rect class="pill" x="124" y="288" width="368" height="26" rx="6"/><text class="s" x="308" y="305" text-anchor="middle">git data, beside the line pass: branches, files, pull requests</text></g>
<g class="n"><rect class="pill" x="502" y="288" width="368" height="26" rx="6"/><text class="s" x="686" y="305" text-anchor="middle">commits left: up to three quiet Builds, a minute apart</text></g>
<g class="n"><rect class="pill" x="124" y="322" width="746" height="26" rx="6"/><text class="s" x="497" y="339" text-anchor="middle">never counted, and shown as not counted: Bulk Commits, lockfiles, Generated Files, binary files, files over 1 MB</text></g>

<text class="t" x="16" y="376">What each run of commitscape build writes, and who reads it</text>
<g class="n"><rect class="svc" x="16" y="398" width="170" height="84" rx="8"/>
<text class="t m" x="101" y="428" text-anchor="middle">commitscape build</text>
<text class="s" x="101" y="445" text-anchor="middle">one run, from</text>
<text class="s" x="101" y="459" text-anchor="middle">the engine cache</text></g>
<g class="n"><rect class="pill" x="214" y="394" width="170" height="26" rx="6"/><text class="m" x="299" y="411" text-anchor="middle">COPY files + manifest</text></g>
<g class="n"><rect class="pill" x="214" y="426" width="170" height="26" rx="6"/><text class="m" x="299" y="443" text-anchor="middle">meta.json</text></g>
<g class="n"><rect class="pill" x="214" y="458" width="170" height="26" rx="6"/><text class="m" x="299" y="475" text-anchor="middle">pack.bin</text></g>
<line class="ar" x1="186" y1="440" x2="212" y2="407" marker-end="url(#b)"/>
<line class="ar" x1="186" y1="440" x2="212" y2="439" marker-end="url(#b)"/>
<line class="ar" x1="186" y1="440" x2="212" y2="471" marker-end="url(#b)"/>
<g class="n"><rect class="store" x="414" y="386" width="220" height="58" rx="8"/>
<text class="t" x="524" y="404" text-anchor="middle">Postgres</text>
<text class="s" x="524" y="420" text-anchor="middle">Stored Index rows; meta, people</text>
<text class="m" x="524" y="435" text-anchor="middle">stored_indexes.pack: the key</text></g>
<g class="n"><rect class="store" x="414" y="456" width="220" height="40" rx="8"/>
<text class="t" x="524" y="472" text-anchor="middle">R2</text>
<text class="m" x="524" y="487" text-anchor="middle">packs/…/&lt;head&gt;-&lt;build&gt;.pack</text></g>
<line class="ar" x1="384" y1="407" x2="412" y2="407" marker-end="url(#b)"/>
<line class="ar" x1="384" y1="439" x2="412" y2="430" marker-end="url(#b)"/>
<line class="ar" x1="384" y1="471" x2="412" y2="476" marker-end="url(#b)"/>
<g class="n"><rect class="svc" x="664" y="398" width="220" height="84" rx="8"/>
<text class="tt" x="774" y="420" text-anchor="middle">Engine service</text>
<text class="s" x="774" y="437" text-anchor="middle">fetches each new pack once,</text>
<text class="s" x="774" y="451" text-anchor="middle">at the first question about it;</text>
<text class="s" x="774" y="465" text-anchor="middle">the Site warms it on publish</text></g>
<line class="ar" x1="634" y1="415" x2="662" y2="425" marker-end="url(#b)"/>
<line class="ar" x1="634" y1="476" x2="662" y2="460" marker-end="url(#b)"/>
</svg>
