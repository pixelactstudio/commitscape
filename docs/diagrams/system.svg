<text class="lbl" x="427" y="88">links to sign in, shows Cards</text>
<line class="ar" x1="180" y1="124" x2="204" y2="124" marker-end="url(#a)"/>
<line class="ar" x1="180" y1="188" x2="204" y2="188" marker-end="url(#a)"/>
<line class="ar" x1="180" y1="252" x2="204" y2="252" marker-end="url(#a)"/>
<line class="ar" x1="180" y1="316" x2="204" y2="316" marker-end="url(#a)"/>
<line class="ar" x1="298" y1="220" x2="322" y2="220" marker-end="url(#a)"/>
<line class="ar" x1="514" y1="118" x2="758" y2="118" marker-end="url(#a)"/>
<text class="lbl" x="636" y="112" text-anchor="middle">reads facts, Profiles</text>
<line class="ar" x1="758" y1="150" x2="516" y2="150" marker-end="url(#a)"/>
<text class="lbl" x="636" y="144" text-anchor="middle">webhooks</text>
<line class="ar" x1="514" y1="232" x2="574" y2="232" marker-end="url(#a)"/>
<text class="lbl" x="545" y="225" text-anchor="middle">pack key</text>
